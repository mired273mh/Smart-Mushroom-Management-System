name: smart-mushroom-new
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: smart_mushroom
      POSTGRES_USER: smart_mushroom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smart_mushroom -d smart_mushroom"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    image: smart-mushroom-api:local
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://smart_mushroom:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/smart_mushroom
    depends_on:
      db: { condition: service_healthy }
    command: ["node", "server/src/cli.js", "migrate"]
    restart: "no"
  api:
    image: smart-mushroom-api:local
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://smart_mushroom:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/smart_mushroom
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
      TRUST_PROXY_HOPS: 1
      HARDWARE_ACTUATION_ALLOWLIST: ${HARDWARE_ACTUATION_ALLOWLIST:-}
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
volumes:
  pgdata:
