name: Verify Smart Mushroom
on: [push, pull_request, workflow_dispatch]
jobs:
  api-web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sm_ci
          POSTGRES_PASSWORD: ci-disposable-only
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sm_ci -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql://sm_ci:ci-disposable-only@127.0.0.1:5432/sm_test_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:web
      - run: npx playwright install --with-deps chromium
      - run: npm run test:web
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          cache: true
      - run: flutter pub get
        working-directory: mobile
      - run: flutter analyze
        working-directory: mobile
      - run: flutter test
        working-directory: mobile
      - run: flutter build web --no-wasm-dry-run
        working-directory: mobile
      - run: npm run test:mobile:api
      - run: npm run test:mobile:web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: flutter-browser-failure
          path: |
            .local/flutter-failure.png
            .local/flutter-semantics.json
          if-no-files-found: ignore
